name: ffcv
channels:
  - pytorch
  - conda-forge
  - defaults
  - menpo
dependencies:
  - python>=3.9, <3.11
  - tqdm
  - numpy<2.0
  - numba
  - einops
  - wandb
  - pytorch-lightning
  - lightning-bolts
  - torchmetrics
  - scipy
  - timm
  - matplotlib
  - pandas
  - lightning
  - umap-learn
  - h5py
  - pkg-config
  - libjpeg-turbo
  - conda-forge::opencv
  - ipykernel
  - jupyterlab
  - geopandas
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/rocm5.6/
      - pytorch-triton-rocm==2.2.0
      - torch==2.2.2+rocm5.6
      - torchaudio==2.2.2+rocm5.6
      - torchvision==0.17.2+rocm5.6
      - tqdm
      - seaborn
      - ipdb
      - pytest
      - lightly
      - ipdb
      - geobench
      - black
      - ffcv
      - kornia
      - contextily
      - hydra-core
      - dask==2024.4.1
      - dask-jobqueue
      - dask-geopandas
      - xarray-datatree
      - h5netcdf
      - xarray
      - jsonargparse
