# Example of small structures captured by RH25 instead of RH98

width: 600
height: 450
tile_id: "32UMV"
# params for plotting RHs for the same location
rhs:
  width: ${width}
  height: ${height}
  row_off: 9277
  col_off: 5561
  tile_id: ${tile_id}
  name: "vsm_example"
  rh_idxs: [25, 98]

# Params for rgb plot
rgb:
  width: ${width}
  height: ${height}
  row_off: 9277
  col_off: 5561
  tile_id: ${tile_id}
  name: "vsm_example"
  max_val: 2000
  time_idxs: [4, 5, 6, 7, 8, 9, 10, 11]

gif:
  width: 100
  height: 100
  cmin: -50
  cmax: 300
  z_exaggeration: 2.0
  camera:
    eye: {x: -0.8, y: -1.2, z: 0.6}
    center: {x: 0, y: 0, z: 0}
    up: {x: 0, y: 0, z: 1}
    projection: {type: "perspective"}
  aspectratio: [1, 1, 0.4]
  orthographic: False
  rh_idxs: [25, 98]
  tiles:
    - name: "Dry deciduous forest"
      tile_id: "42QXJ"
      col_off: 8150
      row_off: 6620
    - name: "Evergreen forest"
