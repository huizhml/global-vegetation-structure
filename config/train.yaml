seed_everything: 42
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0001
# lr_scheduler:
#   class_path: torch.optim.lr_scheduler.StepLR
#   init_args:
#     gamma: 0.1
#     step_size: 10

data:
  class_path: datasets._pl_datamodule.PLDataModel
  init_args: 
    train_fp: ~/flash/data/val.beton
    val_fp: ~/flash/data/val.beton
    # test_ratio: 0.1
    # cal_ratio: 0.1
    # val_ratio: 0.1
    # random_state: 42
    distributed: True
    batches_ahead: 3
    batch_size: 64 # per device
    num_workers: 4 # per device
    pin_memory: True
    shuffle: False
    drop_last: False

model:
  class_path: models.pl_model.UNet
  init_args:
    in_channels: 12
    out_channels: 101
    patch_size: 15
    norm_layer_up: torch.nn.BatchNorm2d
    up_block: models.modules.standard.DoubleConvSkip
    last_opt: torch.nn.Identity
    activation_layer: 
      class_path: torch.nn.ELU
      init_args:
        inplace: True
        alpha: 0.54
    encoder:
      class_path: models.modules.standard.StandardNet
      init_args:
        depths: [64,128,256,512]
        initial_stride: 1
        norm_layer: torch.nn.BatchNorm2d
        block: models.modules.standard.DoubleConvSkip
        kernal_sizes: [3, 1]
    mask_module: datasets.transforms.SlopeWCMask
    loss: models.losses.mse.MSELoss
    upsampling: nearest
    blur_final: False
    blur: False
    final_skip: False
    self_attention: False

trainer:
  accelerator: gpu
  # strategy: auto
  devices: auto
  default_root_dir: /tmp/wandb
  # val_check_interval: 100000
  max_epochs: 100
  num_sanity_val_steps: 0
  # fast_dev_run: 100
  # profiler: advanced
  sync_batchnorm: True
  # enable_checkpointing: False
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: callbacks.boxplot.BoxplotLogger
      init_args:
        log_every: 10
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: 'val_loss'
        filename: 'BestModel-{epoch:02d}-{val_loss:.2f}'
        save_top_k: 1
        mode: min
        every_n_epochs: 10 #check every n epochs
        save_last: True # save the last epoch? or just save the last best model?
    # - class_path: callbacks.index_shuffle.IndexShuffler

  logger:
      class_path: callbacks.wandb_logger.WandbLogger
      init_args:
        project: global-vegetation-structure
        name: test
        job_type: train
        save_dir: /tmp/wandb
