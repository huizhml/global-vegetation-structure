seed_everything: 42
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 0.0006
lr_scheduler:
  class_path: torch.optim.lr_scheduler.StepLR
  init_args:
    gamma: 0.5
    step_size: 30

data:
  class_path: datasets.ffcv_datamodule.FFCVDataModel
  init_args: 
    train_fp: ~/data/GEDI/train_subsets/debug0_filtered_v1.beton
    val_fp: ~/data/GEDI/train_subsets/debug0_filtered_v1.beton
    num_workers: 4
    batches_ahead: 3 # affect ram usage
    batch_size: 4096 # per device
    order: QUASI_RANDOM
    os_cache: False
    distributed: False

model:
  class_path: models.unet.UNet
  init_args:
    out_channels: 101
    patch_size: 15
    norm_layer_up: torch.nn.BatchNorm2d
    up_block: models.modules.standard.DoubleConvSkip
    last_opt: torch.nn.Identity
    encoder:
      class_path: models.modules.standard.StandardNet
      init_args:
        in_channels: 12
        depths: [64, 128, 256, 512]
        kernal_sizes: [3, 3]
        initial_stride: 1
        norm_layer: torch.nn.BatchNorm2d
        activation_layer: 
          class_path: torch.nn.ELU
          init_args:
            inplace: True
            alpha: 0.54
        block: models.modules.standard.DoubleConvSkip
        
    upsampling: nearest
    blur_final: False
    blur: False
    final_skip: False
    self_attention: False
    # used in the base model (_base_pl_model.py)
    transform: datasets.transforms.Normalize
    loss_fc: models.losses.base.MaskedLoss #torch.nn.BCELoss # 

trainer:
  accelerator: gpu
  # strategy: auto
  devices: auto
  default_root_dir: /tmp/wandb
  # val_check_interval: 100000
  # check_val_every_n_epoch: 1
  max_epochs: 100
  num_sanity_val_steps: 0
  # fast_dev_run: 10000
  # profiler: advanced
  # profiler: simple
  #   class_path: lightning.pytorch.profilers.PyTorchProfiler
  #   init_args:
  #     sort_by_key: self_cpu_memory_usage
  sync_batchnorm: True
  # enable_checkpointing: False
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: callbacks.regression_metrics_logger.ErrorMetricsLogger
      init_args:
        log_every: 10
    - class_path: callbacks.prediction_logger.PredictionLogger
      init_args:
        log_every: 50
        log_batch: 2000
    - class_path: callbacks.boxplot.BoxplotLogger
      init_args:
        log_every: 100
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints
        monitor: 'val_loss'
        filename: 'BestModel-{epoch:02d}-{val_loss:.2f}'
        save_top_k: 1
        mode: min
        every_n_epochs: 10 #check every n epochs
        save_last: True # save the last epoch? or just save the last best model?
    # - class_path: callbacks.index_shuffle.IndexShuffler

  logger:
      class_path: callbacks.wandb_logger.WandbLogger
      init_args:
        project: global-vegetation-structure
        name: test
        job_type: train
        save_dir: /tmp/logs
        log_model: True # 'all' would log the model after each epoch
        id: