plot:
  # Skip Tundra due to insufficient data
  skip_biomes: [11]
  # Figure widths are in points (default LaTeX unit)
  coverage:
    fig_width_pt: 350
    fig_height_pt: 130
    flatten: false
    legend_loc: "outside right"
    plot_style:
      axes.titlesize: 6
      legend.fontsize: 7
  avg_width:
    fig_width_pt: 372
    fig_height_pt: 230
eval:
  # Path to the calibration data combined in one table, can be generated with
  # `scripts/cp/combine_parquets.py`
  data_path: /projects/dereeco/data/gvs/gedi/veg_sensitivity_gt0p95/subset_test/version=masked/original_with_ours_sota_biome_2020.parquet
  # Can also be specified by providing a path to a directory containing parquet
  # files, where after collecting all files, they will be combined into one
  # table and preprocessed in the same way as the combined parquet file:
  # data_root: ../data/calibration-data/
  # Flag to indicate whether the data should be preprocessed, which includes
  # filtering out rows with missing values and selecting only the columns
  # specified in the data configuration.
  # IMPORTANT: preprocessing assumes that the data is in meter units
  preprocess_data: true
cp:
  alpha: 0.1
  cqr_methods:
  - CQR
  - SE-CQR
  # Other available methods:
  # - CQR-r
  # - CQR-m
  # - SE-CQR-r
  # - SE-CQR-m
  # Path and data_root option as in the case of eval configuration
  cal_data_path: /projects/dereeco/data/gvs/gedi/veg_sensitivity_gt0p95/subset_cal/version=masked/original_with_ours_sota_biome_2020.parquet
  preprocess_data: true
data:
  # Specifies column names in the data table, where names need to be the same
  # for calibration and evaluation data, as the same configuration is used for
  # both.
  biome_col: BIOME
  rh_cols:
    10:
      ground_truth: rh10
      q_hi: RH10_Q0
      q_lo: RH10_Q2
      q_med: RH10_Q1
    25:
      ground_truth: rh25
      q_hi: RH25_Q0
      q_lo: RH25_Q2
      q_med: RH25_Q1
    50:
      ground_truth: rh50
      q_hi: RH50_Q0
      q_lo: RH50_Q2
      q_med: RH50_Q1
    75:
      ground_truth: rh75
      q_hi: RH75_Q0
      q_lo: RH75_Q2
      q_med: RH75_Q1
    95:
      ground_truth: rh95
      q_hi: RH95_Q0
      q_lo: RH95_Q2
      q_med: RH95_Q1
    98:
      ground_truth: rh98
      q_hi: RH98_Q0
      q_lo: RH98_Q2
      q_med: RH98_Q1
  other_cols:
  - lc
  - slope
  - BIOME
  - ECO_ID
  - lat
  - lon
  - geometry
  - shot_number
  - digital_elevation_model
  - solar_elevation
  - sensitivity
  - urban_proportion
  - elevation_bias_flag
  - surface_flag
  - num_detectedmodes
  - selected_mode
  - selected_mode_flag
  - energy_total
  - elev_highestreturn
  - elev_lowestmode
  - beam
