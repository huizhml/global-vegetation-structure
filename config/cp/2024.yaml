# Conformal calibration of the 2024 VSM Q0 (upper) / Q2 (lower), paper method
# (Methods 4.4): signed-error CQR (SE-CQR here, alpha_lo = alpha_hi = alpha / 2),
# per RH and WWF biome. Tundra (11) is fitted but not applied.
# Points: tools/cp_points.py (cp_points.sh select, add_q1, LUMI Q0/Q2, combine):
# the model's cal/test tiles as in 2020, per tile as many GEDI 2024 shots
# (sensitivity >= 0.95) as the 2020 set has there, predictions from the
# bias_corrected release (same per-tile bias added to Q0/Q1/Q2, then blended).
#   sbatch --mem=128G scripts/hendrix/cp_points.sh run_cp config=config/cp/2024.yaml
output_dir: ~/data/gvs/conformal/2024
plot:
  # Skip Tundra due to insufficient data
  skip_biomes: [11]
  coverage:
    fig_width_pt: 350
    fig_height_pt: 130
    flatten: false
    legend_loc: "outside right"
    plot_style:
      axes.titlesize: 6
      legend.fontsize: 7
  avg_width:
    fig_width_pt: 372
    fig_height_pt: 230
eval:
  data_path: /projects/dereeco/data/gvs/conformal/2024/model_split_points/test.parquet
  # values are in metres
  preprocess_data: true
cp:
  alpha: 0.1
  cqr_methods:
  - SE-CQR
  cal_data_path: /projects/dereeco/data/gvs/conformal/2024/model_split_points/cal.parquet
  preprocess_data: true
data:
  biome_col: BIOME
