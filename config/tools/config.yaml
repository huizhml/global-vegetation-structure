  # =========================================================================
  # 预测稳定性测试:每个 WWF biome 抽几个 tile 重新预测,和发布版比。第一步只做 2024,
  # 比较 A 新预测(不平移)、B bias_corrected、C 新预测 + 每 tile median δ。
  # tile 从 CP 的 cal/test 点里选(biome = tile 内点的多数 biome)。
