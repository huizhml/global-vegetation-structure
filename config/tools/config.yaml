    threads: 16
    tiles_per_worker: 20
    tiles_file: null
    chunk: 1
    n_chunks: 1

  # 合成一张表 <save_dir>/<split>.parquet;max_per_biome=null 不限(2020 也没限)
  #   python -m tools.run run=combine_cp_points run.split=cal
  combine_cp_points:
    _target_: tools.cp_points.combine_cp_points
    target_type: function
    save_dir: ~/data/gvs/conformal/2024/model_split_points/with_q012
    split: cal
    # null -> <save_dir>/<split>.parquet
    out_file: null
    max_per_biome: null
    seed: 42

  # =========================================================================
  # tools/cp_apply.py
  # =========================================================================
  # 把 run_cp.py 拟合的每 biome offset 加到发布版 Q0/Q2 上(paper Methods 4.4:SE-CQR,
  # 先排序三个分位,Q2'=min-c_lo,Q0'=max+c_hi,再夹住 Q1)。Q1 不动不写。
  # Tundra、WWF 98/99、不在任何 WWF 多边形里、有 nodata 的像元保留原值。
  #   sbatch --array=1-10 scripts/hendrix/cp_points.sh apply year=2020
  apply_cp_offsets:
    _target_: tools.cp_apply.apply_cp_offsets
    target_type: function
    year: 2020
    manifest: ~/data/gvs/products/vsm/${.year}/released_v0.tsv
    products_root: ~/data/gvs/products/vsm
    cp_results: ~/data/gvs/conformal/${.year}/cp_results.parquet
    biome_file: ~/data/GEDI/ecoregions/wwf_terr_ecos.shp
    save_dir: ~/data/gvs/products/vsm/${.year}/calibrated/tiles/cog
    state_dir: ${.save_dir}_state
    method: SE-CQR
    exclude_biomes: [11]     # Tundra: 24 cal points, not calibrated in the paper
    workers: 8
    # 一行一个 tile;null -> manifest 里全部 tile
    tiles_file: null
    chunk: 1
    n_chunks: 1

  # 写好的 tile 和落在里面的 test 点对一遍:biome、Q0/Q2 是否等于对点上原值加 offset、覆盖率
  #   python -m tools.run run=check_cp_tiles 'run.tiles=[01GEL,32UNG]'
  check_cp_tiles:
    _target_: tools.cp_apply.check_cp_tiles
    target_type: function
    year: 2020
    tiles: ???
    manifest: ~/data/gvs/products/vsm/${.year}/released_v0.tsv
    products_root: ~/data/gvs/products/vsm
    cp_results: ~/data/gvs/conformal/${.year}/cp_results.parquet
    biome_file: ~/data/GEDI/ecoregions/wwf_terr_ecos.shp
    save_dir: ~/data/gvs/products/vsm/${.year}/calibrated/tiles/cog
    test_data: /projects/dereeco/data/gvs/modeling/gedi/veg_sensitivity_gt0p95/subset_test/version=masked/original_with_ours_sota_biome_${.year}.parquet
    method: SE-CQR
    exclude_biomes: [11]
    rh_idxs: [10, 25, 50, 75, 95, 98]
    save_file: null

  # 已校准完、还没全部传上 Source Coop 的 tile 列表,给 sc_upload 当 tile 白名单
  # (run.src.kind=local),每次只列还要传的 tile。上传进度在一个 tsv 里(upload_state)。
  #   sbatch --time=11:00:00 scripts/hendrix/cp_points.sh upload year=2020   (先 source-coop login)
  cp_upload_tiles:
    _target_: tools.cp_apply.cp_upload_tiles
    target_type: function
    year: 2020
    save_dir: ~/data/gvs/products/vsm/${.year}/calibrated/tiles/cog
