    out_file: ~/data/gvs/products/vsm/${.year}/calibrated/upload_tiles.txt
    n_files: 202

  # 删掉 202 个文件在上传 tsv 里都是 done 的本地 tile。默认 dry run。
  #   python -m tools.run run=prune_uploaded_tiles run.dry_run=false
  prune_uploaded_tiles:
