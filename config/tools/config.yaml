    out_dir: ~/data/gvs/vsm_stability/2017_2026/sample_pixels
    n_pixels: 20000
    seed: 42

  # 3. LUMI:tile x 年的 worklist(2020 不预测)
  #   python -m tools.run run=write_stability_worklist
  write_stability_worklist:
