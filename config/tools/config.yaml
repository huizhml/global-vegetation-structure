  sample_stability_tile:
    _target_: tools.vsm_stability.sample_stability_tile
    target_type: function
    root: /scratch/project_465003168/hui/gvs
    tile: ???
    year: ???
    pred_dir: null       # 读栅格(<pred_dir>/RH*_Q*.tif)时用
    samples_file: null   # 预测直接保留的点值(point_samples/<year>/<tile>.parquet)
    pixels_dir: ${.root}/vsm_stability/2017_2026/sample_pixels
