    per_biome: 3
    min_shots: 500
    seed: 42

  # LUMI(project_465003168 scratch):A = 新预测(run_lumi_inference.sh predict_tiles),
  # B = CP 点上的发布版值,C = A + 每 tile 每 RH median(GEDI - A Q1)(用评估点以外的 GEDI 点)
  #   python -m tools.run run=eval_stability
  eval_stability:
    _target_: tools.vsm_stability.eval_stability
    target_type: function
    root: /scratch/project_465003168/hui/gvs
    tiles_file: ${.root}/vsm_stability_state/tiles_2024.tsv
    points_dir: ${.root}/vsm_stability/2024/cp_points
    gedi_dir: ${.root}/gedi/veg_sensitivity_all/2024
    cog_root: ${.root}/vsm_stability/2024/new_prediction/cog
    out_dir: ${.root}/vsm_stability/2024/eval
    report_dir: ${.root}/vsm_stability_state/2024
    n_delta_shots: 5000
    sensitivity_min: 0.95
    seed: 42
    workers: 8
    threads: 8

  # 多年稳定性 2017-2026(每 biome 5 个 tile + Tundra):每个 tile 固定的随机像元,每年读一次
  # 预测(新代码重新预测;2020 读发布版 released_v0),有 GEDI 的年份另外读 GEDI 点。
  # GeoTIFF 采样后删掉,只留采样值。
  # 1. Hendrix(要 CP 点和 WWF):选 tile,保留 2024 的 39 个
  #   python -m tools.run run=select_stability_tiles_years
