    keep_file: ~/data/gvs/vsm_stability_state/tiles_2024.tsv
    out_file: ~/data/gvs/vsm_stability_state/tiles_2017_2026.tsv
    per_biome: 5
    min_shots: 500
    seed: 42
    # CP 点里没有 Tundra 的 tile -> 按 WWF 面积比例从 S2 网格里选
    wwf_biomes: [11]
    grid_file: ~/data/gvs/01_derived_ancillary/growing_months/s2_tiles_with_growing_months.parquet
    biome_file: ~/data/GEDI/ecoregions/wwf_terr_ecos.shp
