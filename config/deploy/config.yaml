# All deploy/ ops registered as Hydra `run=<name>` configs.
# Layout: <section> -> <op_name> -> <op fields>
#
# Single entrypoint loads this section:
#   python -m deploy.run    run=sc_upload
#
# Placeholders use Python str.format style ({year}, {tile}) and are resolved by
# tools.utils.resolve_args in deploy/run.py against sibling fields of the op.
#
# `root_results_dir` is read by config.runner.run_cli to index each op's
# `save_dir` under <root_results_dir>/deploy/<op> via a symlink. The transfer
# ops below write no local artifacts, so they carry no save_dir.
#
# NOTE: this is the ops registry for the deploy/ package. It is unrelated to
# config/deploy.yaml, which is the Lightning CLI predict/deploy config.

root_data_dir: ~/data/gvs
root_results_dir: ~/data/gvs/results

# 优先发布的 15 个 key RH。RH 编号是唯一事实来源,模式由 rh_globs resolver
# 生成(config/loader.py),四个消费方共用同一份,不再各抄一份 15 条 glob。
#
# 当前这一轮只发 Q1。要扩到三个分位数就把下面两行的 `,1` 换成 `,'*'`。
# 模式里的 `_Q` 不是装饰:`RH10*` 会把 RH100 也匹配进来,分隔符必须钉死。
priority_rhs: [0, 10, 20, 25, 30, 40, 50, 60, 70, 75, 80, 90, 95, 98, 100]
priority_rh_stac: ${rh_globs:${priority_rhs},1}            # kind=stac:匹配文件名
priority_rh_local: ${rh_globs:${priority_rhs},1,'**/'}     # kind=local:匹配相对路径

deploy:

  # =========================================================================
  # deploy/source_coop/upload.py
  # =========================================================================
  # LUMI-O -> Source Cooperative 正式传输。断点续传状态写在 state_prefix 下的
  # .done / .failed 里,重跑自动跳过已完成的 key。
  #   python -m deploy.run run=sc_upload run.mode=selftest   # 先自检
  #   python -m deploy.run run=sc_upload run.src.bucket=32m-2024 \
  #       run.src.prefix=32MNC/ run.dst.prefix=gvsm/2024/32MNC/ \
  #       run.state_prefix=$PWD/state/32MNC run.workers=64
  sc_upload:
    _target_: deploy.source_coop.upload.upload_to_source_coop
    target_type: function
    # null = 必填,由命令行给;留 null 而不是写默认值,是防止手滑把 545 万个
    # 对象传进错误的桶/前缀。
    src:
      bucket: null             # 例: 32m-2024;整桶传时 prefix 留空
      prefix: ""
      rclone_remote: lumi-465002698-private   # 凭证从 rclone config dump 读
      region: us-east-1
      # kind=local 时改为从本地目录读(2020 年的数据在 hendrix 本地盘上),
      # 此时 bucket/prefix/rclone_remote 全部忽略,key 就是相对 dir 的路径。
      # kind=stac 时从 STAC collection 读:2020 年的 tile 分散在三个 root 下
      # (original/tiles/cog、original/tiles/geotiff、masked/tiles/geotiff),
      # 只有 item JSON 知道每个 tile 在哪,拿一个 dir + glob 去扫会挑错副本。
      kind: s3                 # s3 | local | stac
      dir: null                # kind=local 时必填,例: ~/data/gvs/2020
      catalog: null            # kind=stac 时必填,collection 目录(下面一层是
                               # <TILE>_<YEAR>/<TILE>_<YEAR>.json),例:
                               # ~/data/gvs/products/gvsm_stac_catalog/vsm_local_masked
      # tile 白名单文件(每行一个 tile id),null = 全部。直接吃
      # stac_cog_audit 写出的 <prefix>_have_cog.txt —— Q1-first 滚动发布时
      # 必须用它:没转的 tile 其 href 还指向 geotiff,不过滤就会把转换前的
      # 原件也发出去,而且全程不报错。
      tiles: null
      # 上传顺序。tile = 逐个 tile 展开它的全部 asset(默认);
      # asset = 按 glob 列表的顺序,一个模式扫完所有 tile 再下一个 ——
      # 配 ${priority_rh_stac} 就是"先发 RH0 的所有 tile,再发 RH10 的",
      # 每个 RH 一完成就是一个全球完整的图层。
      order: tile              # tile | asset
      # kind=local 匹配的是相对 dir 的路径,kind=stac 匹配的是 asset 文件名。
      # 分位数分批上传就靠后者:RH*_Q1.tif 只挑中位数那一档。
      glob: "**/*.tif"
    dst:
      bucket: geoai-ucph
      prefix: null             # 例: gvsm/2024/  (布局: gvsm/<year>/<tile>/)
      endpoint: https://data.source.coop
      profile: source-coop     # ~/.aws/config 里配 credential_process
      region: us-east-1
    state_prefix: null         # 断点续传状态,例: $PWD/state/32MNC
    mode: run                  # run | dry | selftest
    workers: 32
    submit_chunk: 2000         # 分批提交,避免一次建几百万个 future
    max_attempts: 3            # 单对象外层重试次数
    only_failed: false         # 只重传 <state_prefix>.failed 里的 key
    allow_empty: false         # 源前缀为空时按成功退出而不是报错
    progress_every: 100
    # source.coop 的 token 最长 12h,且从 `source-coop login --duration 12h`
    # 那一刻起算 —— 不是从作业开始跑起算。剩余不足这么多分钟就直接失败,不要
    # 传到一半撞 403(进度在状态文件里,重新 login 后原命令扔回去即可)。
    min_cred_minutes: 30
    # 跑到凭证只剩这么多分钟时,停止提交新对象、等在途的传完、干净退出。
    # 撞 403 会在 .failed 里留下一批本可避免的记录;干净退出后重新登录、原命令
    # 重跑就从 .done 之后接着走。0 = 关掉。
    stop_before_cred_expiry: 20
    # source.coop 对单次 PutObject 有大小上限 —— 实测 ~110 MB 的 COG 直接返回
    # 413 Request Entity Too Large,同批里偏小的却能过。所以写入一律走
    # upload_fileobj + multipart(`aws s3 sync` 也是超过 8 MB 就自动切片)。
    # chunk 大小同时也是单个线程的内存占用:workers × chunk 就是峰值内存。
    multipart_threshold_mb: 32
    multipart_chunk_mb: 32
    # 开跑前抽查源文件落在哪个产品 root(cog/ 还是转换前的 geotiff/)。
    # kind=stac 时要解析若干 item JSON,慢的话可以关;但 mode=dry 和实传别关 ——
    # 传错副本不会报任何错。
    check_source_roots: true
    selftest_size_mb: 1.0      # selftest 往返校验的探测对象大小
    selftest_large_mb: 128     # multipart 探测对象,必须大于 413 阈值(~110 MB)

  # =========================================================================
  # deploy/source_coop/bench.py
  # =========================================================================
  # 上线前的并发调优基准:先 mode=read 拿源端天花板,再 mode=workers 扫线程数,
  # 最后 mode=procs 模拟同节点多作业。dst.prefix 必须含 "_bench"(硬保护)。
  #   python -m deploy.run run=sc_bench run.mode=read run.src.bucket=32m-2024 \
  #       run.src.prefix=32MND/
  #   python -m deploy.run run=sc_bench run.mode=procs run.workers=64 \
  #       'run.procs_grid=[1,2,4,8]'
  sc_bench:
    _target_: deploy.source_coop.bench.benchmark_transfer
    target_type: function
    src:
      bucket: null             # kind=s3 时必填,例: 32m-2024
      prefix: ""
      rclone_remote: lumi-465002698-private
      region: us-east-1
      # 三种源保持和 sc_upload 一致 —— 基准要测的就是正式传输会读的那批文件,
      # 尤其 kind=stac:2020 的 tile 分散在三个 root 下,按目录扫会挑错副本,
      # 测出来的对象尺寸也就不对。
      kind: s3                 # s3 | local | stac(见 sc_upload 的说明)
      dir: null                # kind=local 时必填
      catalog: null            # kind=stac 时必填
      tiles: null              # tile 白名单文件,见 sc_upload 的说明
      order: tile              # tile | asset,见 sc_upload 的说明
      # kind=local 匹配相对 dir 的路径;kind=stac 匹配 asset 文件名(不能带
      # '/',整档用 '*.tif',分位数用 'RH*_Q1.tif')。
      glob: "**/*.tif"
    dst:
      bucket: geoai-ucph
      prefix: gvsm/_bench/     # 必须含 "_bench",防止基准数据写进真实路径
      endpoint: https://data.source.coop
      profile: source-coop
      region: us-east-1
    mode: workers              # read | workers | procs | cleanup
    workers: 32                # procs 模式下每个进程的线程数
    workers_grid: [16, 32, 64, 128]
    procs_grid: [1, 2, 4, 8]
    trial_gb: 5.0              # 每档搬多少数据
    settle_sec: 10.0           # 试验间冷却,避免连接复用让后一轮虚高
    keep_objects: false
    # 与 sc_upload 保持一致,否则测出来的不是正式传输会走的那条路径。
    multipart_threshold_mb: 32
    multipart_chunk_mb: 32
    check_source_roots: true   # 见 sc_upload;基准里嫌慢可以关

  # =========================================================================
  # deploy/source_coop/move.py
  # =========================================================================
  # 已发布对象改前缀。S3 没有 rename,但 source.coop 支持服务端 CopyObject
  # (ETag 与源一致,不经过本地),所以调整目录结构不用从 hendrix 重传。
  #   python -m deploy.run run=sc_move run.mode=dry \
  #       run.src_prefix=gvsm/2020/ run.dst_prefix=gvsm/2020/tiles/
  sc_move:
    _target_: deploy.source_coop.move.move_within_source_coop
    target_type: function
    dst_bucket: geoai-ucph
    src_prefix: null         # 例: gvsm/2020/
    dst_prefix: null         # 例: gvsm/2020/tiles/  (可以嵌套在源前缀下)
    endpoint: https://data.source.coop
    profile: source-coop
    region: us-east-1
    state_prefix: null       # 断点续传状态,mode=run 时必填
    mode: run                # run | dry
    workers: 128
    submit_chunk: 5000
    max_attempts: 3
    only_failed: false
    progress_every: 1000
    # true = 只复制不删源。想先验证一轮再删的时候用,注意期间存储是双份的。
    keep_source: false
    min_cred_minutes: 30
    stop_before_cred_expiry: 20
