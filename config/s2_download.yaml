defaults:  
  - _self_  
  - override hydra/hydra_logging: disabled  
  # - override hydra/job_logging: none

zone: 01G
year: 2019
n_parallel: 32
partition_size: 512K
root_dir:
data_dir: GEDI
save_dir: data/GEDI
rewrite: False
patch_size: 15
sem_max_release: 100

# STEP 1: Sentinel-2 candidates & metadata gather
max_cloud_cover: 50
max_water_percentage: 99
query_days: 90

# STEP 2: Sentinel-2 best candidates selection
from_df: 'part_*_with_s2'
to_save_df: 'partition_*'


hydra:
  job_logging:
    root:
      handlers: [console]
  job:
    chdir: False
  run:
    dir: .