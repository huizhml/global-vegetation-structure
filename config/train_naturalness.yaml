seed_everything: 42
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 0.0001
    weight_decay: 0.05 # 0.0001
lr_scheduler:
  class_path:  models._scheduler.ChainedScheduler # torch.optim.lr_scheduler.StepLR
  init_args:
    warmup_steps: 1010 # 10 epochs, 2020, was 1800
    T_0: 40400 # 36000
    eta_min: 1e-6
    max_lr: 0.0001
    gamma: 0.2


data:
  class_path: datasets.h5_dataset.NaturalnessDataModule
  init_args: 
    data_file: ~/data/gvs/downstream_task_data/rhs_predictions_2017_izraz2av.h5
    naturalness_fp: ~/data/gvs/downstream_task_data/naturalness/reference_data_set_updated.csv
    rh_idxs: full_profile
    use_s2: false
    diversity: null   # null | all | [fhd, enl1d, enl2d, cr]  (RH-derived, computed on GPU)
    num_workers: 0
    batch_size: 1024 # per device

model:
  class_path: models.naturalness_mapping.NaturalnessMapping
  init_args:
    mean_std_fp: ~/data/gvs/downstream_task_data/naturalness/mean_std.npz
    loss_fc: torch.nn.CrossEntropyLoss
    backbone: # --model.backbone config/model/xception_s2.yaml


trainer:
  accelerator: gpu
  strategy: auto
  devices: auto
  default_root_dir: logs/wandb
  # val_check_interval: 100000
  # check_val_every_n_epoch: 1
  max_epochs: 200
  num_sanity_val_steps: 0
  reload_dataloaders_every_n_epochs: 0  # naturalness preloads into RAM once; rebuilding每epoch会重载~11GB
  # fast_dev_run: 100
  # profiler: advanced
  # profiler: simple
  #   class_path: lightning.pytorch.profilers.PyTorchProfiler
  #   init_args:
  #     sort_by_key: self_cpu_memory_usage
  sync_batchnorm: True
  # enable_checkpointing: False
  callbacks:
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        dirpath: checkpoints
        monitor: 'val.loss'
        filename: 'BestModel-{epoch:02d}-{val.loss:.2f}'
        save_top_k: 1
        mode: min
        every_n_epochs: 100 #check every n epochs
        save_last: True # save the last epoch? or just save the last best model?

  logger:
      class_path: callbacks.wandb_logger.WandbLogger
      init_args:
        project: global-vegetation-structure-v1
        name: test
        job_type: train
        save_dir: logs
        log_model: 'all' # 'all' would log the model after each checkpoint being saved
        id: