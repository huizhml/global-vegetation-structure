    save_dir: ${.root_dir}/results/steep_slope_filtered_bin_${.bin_width}m_max_height_${.max_height}m


# =========================================================================
# evaluation/on_naturalness.py
# =========================================================================
on_naturalness:
  # STEP 1. calculate patch stats (mean and std) for logistic regression
  cal_s2_patch_stats:
    _target_: evaluation.on_naturalness.cal_patch_stats
    target_type: function
    year: 2017
    ps: 15
    product: s2
    root_dir: ${nat_dir}
    ref_csv_train: ${.root_dir}/reference_data_set_updated_train.csv
    patch_file: ${.root_dir}/results_from_vsm_${.year}/s2_gedi_patches_ps31/s2_${.year}_ps31.h5
    out_file: ${.root_dir}/results_from_vsm_${.year}/intermediates/s2_patch_stats_ps${.ps}_train.parquet

  cal_alpha_em_patch_stats:
    _target_: evaluation.on_naturalness.cal_patch_stats
    target_type: function
    year: 2017
    ps: 15
    product: alpha_em
    root_dir: ${nat_dir}
    ref_csv_train: ${.root_dir}/reference_data_set_updated_train.csv
    patch_file: ${.root_dir}/alphaearth_embeddings/alphaearth_embeddings.h5
    out_file: ${.root_dir}/results_from_vsm_${.year}/intermediates/alpha_em_patch_stats_ps${.ps}_train.parquet

  cal_vsm_17_patch_stats:
    _target_: evaluation.on_naturalness.cal_patch_stats
    target_type: function
    year: 2017
    ps: 15
    product: vsm
    root_dir: ${nat_dir}
    ref_csv_train: ${.root_dir}/reference_data_set_updated_train.csv
    patch_file: ${.root_dir}/results_from_vsm_${.year}/vsm_patches_ps15_single_h5_72xl3wma_ps31.zarr
    out_file: ${.root_dir}/results_from_vsm_${.year}/intermediates/vsm_patch_stats_ps${.ps}_train.parquet

  cal_vsm_patch_stats:
    _target_: evaluation.on_naturalness.cal_vsm_patch_stats
    target_type: function
    split: val
    year: 2020
    root_dir: ${nat_dir}
    ref_by_tile_dir: ${.root_dir}/loc_by_tile_${.split}
    vsm_patches_dir: ${.root_dir}/results_from_vsm_${.year}/vsm_patches_ps15_single_h5
    save_dir: ${.root_dir}/results_from_vsm_${.year}/vsm_s2_alpha_patch_stats_ps15_${.split}
    s2_patch_file: ${.root_dir}/results_from_vsm_${.year}/s2_gedi_patches_ps31/s2_${.year}_ps31.h5
    alpha_em_patch_file: ${.root_dir}/alphaearth_embeddings/alphaearth_embeddings.h5

  # STEP 2. run logistic regression and save predictions
  run_naturalness_classification:
    _target_: evaluation.on_naturalness.run_classification
    target_type: function
    year: 2017
    ps: 15
    root_dir: ${nat_dir}
    classifier: logistic_regression
    patch_stats_dir: ${.root_dir}/results_from_vsm_${.year}
    save_dir: ${.root_dir}/results_from_vsm_${.year}/naturalness_classification_ps${.ps}

  # STEP 3. gather results from CNN runs
  gather_cnn_results:
    _target_: evaluation.on_naturalness.gather_cnn_predictions
    target_type: function
    pred_dir: ${nat_dir}/results_from_vsm_2017/cnn_results
    save_dir: ${.pred_dir}

  # STEP 4. plot results 
  plot_bars_spatial_context: # logistic regression
    _target_: evaluation.on_naturalness.plot_results
    target_type: function
    root_dir: ${nat_dir}/results_from_vsm_2017/naturalness_classification_ps15
    summary_file: ${.root_dir}/logistic_regression_summary_reports.csv
    per_class_file: ${.root_dir}/logistic_regression_per_class_reports.csv
    all_cms_file: ${.root_dir}/logistic_regression_confusion_matrices.npz
    save_dir: ${.root_dir}
    baseline_name: rh98
    groups: [rh98, rh98_fhd, rh98_enl2d, rh98_cr, rh98_fhd_enl1d_enl2d_cr, key_rhs, rh98_s2, full_profile, full_profile_s2]
    figsize: [12, 5]
    show_legend: False

  plot_bars_center_pixel: # logistic regression
    _target_: evaluation.on_naturalness.plot_results
    target_type: function
    root_dir: ${nat_dir}/results_from_vsm_2017/naturalness_classification_ps15
    summary_file: ${.root_dir}/logistic_regression_summary_reports.csv
    per_class_file: ${.root_dir}/logistic_regression_per_class_reports.csv
    all_cms_file: ${.root_dir}/logistic_regression_confusion_matrices.npz
    save_dir: ${.root_dir}
    baseline_name: full_profile_center
    groups: [full_profile_center, full_profile]
    figsize: [12, 5]


  plot_cnn_results:
    _target_: evaluation.on_naturalness.plot_results
    target_type: function
    root_dir: ${nat_dir}/results_from_vsm_2017/cnn_results
    summary_file: ${.root_dir}/cnn_summary_reports.csv
    per_class_file: ${.root_dir}/cnn_per_class_reports.csv
    all_cms_file: ${.root_dir}/cnn_confusion_matrices.npz
    save_dir: ${.root_dir}
    plot_types: ['bars']
    baseline_name: rh98
    groups: [rh98, rh98_fhd, rh98_enl2d, rh98_cr, rh98_fhd_enl1d_enl2d_cr, key_rhs, rh98_s2, full_profile, full_profile_s2]
    figsize: [12,5]

  # STEP 5. save predictions from all models for map analysis
  agg_preds_from_models:
    _target_: evaluation.on_naturalness.agg_preds_from_models
    target_type: function
    root_dir: ${nat_dir}/results_from_vsm_2017
    cnn_pred_dir: ${.root_dir}/cnn_results
    logreg_pred_file: ${.root_dir}/naturalness_classification_ps15/logistic_regression_predictions.parquet
    save_dir: ${.root_dir}
    out_name: aggregated_predictions_cnn_logreg.fgb

  # STEP 6. aggregate performance on geo grid cells
  agg_preds_on_grid:
    _target_: evaluation.on_naturalness.agg_preds_on_grid
    target_type: function
    root_dir: ${nat_dir}/results_from_vsm_2017
    preds_file: ${.root_dir}/aggregated_predictions_cnn_logreg.fgb
    grid_file: ${root_data_dir}/assets/world_1deg_land_grid.parquet
    save_dir: ${.root_dir}
    out_name: preds_on_world_grid.parquet
    min_points_per_cell: 10

  # Cross-package: targets tools.parq_ops. Registered here so the existing
  # `eval-merge-patch-stats` justfile recipe keeps working. Move to the tools
  # YAML when the tools/ sweep lands.
  merge_patch_stats:
    _target_: tools.parq_ops.merge_columns_from_files
    target_type: function
    parq_dir: ${nat_dir}/results_from_vsm_2017/intermediates
    ps: 15
    filename_pattern: '*train.parquet'
    save_fp: ${nat_dir}/results_from_vsm_2017/vsm_patch_stats_ps${.ps}_train.parquet


