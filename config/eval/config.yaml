# All evaluation/ ops registered as Hydra `run=<name>` configs.
# Layout: <section> -> <op_name> -> <op fields>
#
# Each per-module entrypoint loads its own section, e.g.:
#   python -m evaluation.diversity_maps    run=create_global_diversity_maps
#   python -m evaluation.on_naturalness    run=plot_bars_spatial_context
#
# Interpolation (OmegaConf):
#   ${name}    absolute, from config root  ->  resolves cfg.<name>   (shared values)
#   ${.name}   relative, sibling field     ->  resolves a field in the same op
#
# File-level scalars below are accessible to every op via absolute ${...}.

root_data_dir: ~/data/gvs
eval_dir: ~/data/gvs/evaluation
gedi_dir: /projects/dereeco/data/gvs/gedi/veg_sensitivity_gt0p95
nat_dir: ~/data/gvs/evaluation/downstream_tasks/naturalness
root_results_dir: ~/data/gvs/results

# =========================================================================
# evaluation/on_gedi.py
# =========================================================================
on_gedi:

  evaluate_vsm_on_gedi:
    _target_: evaluation.on_gedi.evaluate_vsm_on_gedi
    target_type: function
    group_size: 10
    slope_lt20: True
    figsize: [8, 4] 
    ref_and_ours_dir: ${gedi_dir}/subset_test/version=masked
    save_dir: ${.ref_and_ours_dir}/results


